services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: commerceiq
      POSTGRES_PASSWORD: commerceiq
      POSTGRES_DB: commerceiq
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerceiq -d commerceiq"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: {context: ., dockerfile: Dockerfile.api}
    environment:
      DATA_MODE: demo
      DATABASE_URL: postgresql://commerceiq:commerceiq@postgres:5432/commerceiq
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on: {postgres: {condition: service_healthy}}
  streamlit:
    build: {context: ., dockerfile: Dockerfile.streamlit}
    environment: {DATA_MODE: demo, API_URL: http://api:8000}
    ports: ["8501:8501"]
    depends_on: [api]
